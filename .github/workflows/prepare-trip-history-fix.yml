name: Prepare trip-history regression fix

on:
  push:
    branches:
      - fix/trip-history-energy-powertrain

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          trip_path = Path('custom_components/sv_dashboard/static/trip-history-card.js')
          trip = trip_path.read_text()
          old = '''        const hasTripType = trips.some((trip) => trip.attributes?.trip_type && trip.attributes.trip_type !== "unknown");
        const columnCount = hybridLayout ? 6 : 4 + (hasEnergy ? 2 : 0) + (hasFuel ? 1 : 0) + (hasTripType ? 1 : 0) + (hasMaxSpeed ? 1 : 0);'''
          new = '''        const showTripType = hybridLayout;
        const columnCount = hybridLayout ? 7 : 4 + (hasEnergy ? 2 : 0) + (hasFuel ? 1 : 0) + (hasMaxSpeed ? 1 : 0);'''
          assert old in trip
          trip = trip.replace(old, new)

          old = '''                                ${hybridLayout ? html`<th>${text.consumption}</th><th>l/100 km</th>` : html`${hasEnergy ? html`<th>${text.energy}</th><th>${text.consumption}</th>` : nothing}${hasFuel ? html`<th>l/100 km</th>` : nothing}${hasTripType ? html`<th>${dashboardText.powertrain}</th>` : nothing}${hasMaxSpeed ? html`<th>${text.maximum}</th>` : nothing}`}'''
          new = '''                                ${hybridLayout ? html`<th>${text.consumption}</th><th>l/100 km</th><th>${dashboardText.powertrain}</th>` : html`${hasEnergy ? html`<th>${text.energy}</th><th>${text.consumption}</th>` : nothing}${hasFuel ? html`<th>l/100 km</th>` : nothing}${hasMaxSpeed ? html`<th>${text.maximum}</th>` : nothing}`}'''
          assert old in trip
          trip = trip.replace(old, new)

          old = '''                                ${hybridLayout ? html`
                                    <td>${invalid ? "—" : this._value(trip.attributes?.energy_per_100_km)}</td>
                                    <td>${invalid ? "—" : this._value(trip.attributes?.fuel_consumption_l_100km)}</td>
                                ` : html`
                                    ${hasEnergy ? html`<td>${this._value(trip.attributes?.energy_kwh)}</td><td>${invalid ? "—" : this._value(trip.attributes?.energy_per_100_km)}</td>` : nothing}
                                    ${hasFuel ? html`<td>${invalid ? "—" : this._value(trip.attributes?.fuel_consumption_l_100km)}</td>` : nothing}
                                    ${hasTripType ? html`<td><span class="trip-type">${({ ev: "EV", hybrid: "Hybrid", ice: "ICE" })[trip.attributes?.trip_type] || "—"}</span></td>` : nothing}
                                    ${hasMaxSpeed ? html`<td>${invalid ? "—" : this._value(trip.attributes?.max_speed)}</td>` : nothing}
                                `}'''
          new = '''                                ${hybridLayout ? html`
                                    <td>${invalid ? "—" : this._value(trip.attributes?.energy_per_100_km)}</td>
                                    <td>${invalid ? "—" : this._value(trip.attributes?.fuel_consumption_l_100km)}</td>
                                    <td><span class="trip-type">${({ ev: "EV", hybrid: "Hybrid", ice: "ICE" })[trip.attributes?.trip_type] || "—"}</span></td>
                                ` : html`
                                    ${hasEnergy ? html`<td>${this._value(trip.attributes?.energy_kwh)}</td><td>${invalid ? "—" : this._value(trip.attributes?.energy_per_100_km)}</td>` : nothing}
                                    ${hasFuel ? html`<td>${invalid ? "—" : this._value(trip.attributes?.fuel_consumption_l_100km)}</td>` : nothing}
                                    ${hasMaxSpeed ? html`<td>${invalid ? "—" : this._value(trip.attributes?.max_speed)}</td>` : nothing}
                                `}'''
          assert old in trip
          trip = trip.replace(old, new)
          trip = trip.replace('${hasTripType ? html`<span><strong>${dashboardText.powertrain}:</strong>', '${showTripType ? html`<span><strong>${dashboardText.powertrain}:</strong>')
          assert 'hasTripType' not in trip
          trip_path.write_text(trip)

          history_path = Path('custom_components/sv_dashboard/server_history.py')
          history = history_path.read_text()
          marker = '\n\nclass ServerHistoryManager:'
          assert marker in history
          helper = r'''


def enrich_trips_with_local_energy(
    server_trips: list[dict[str, Any]],
    local_trips: list[dict[str, Any]] | None = None,
) -> list[dict[str, Any]]:
    """Fill only missing electric trip energy from a matched local observation.

    The server trip remains canonical for timing, distance and fuel telemetry.
    Local SV tracking is used only when the server row has no electric energy,
    a positive locally derived energy value exists, and odometer/distance match
    the same physical trip. Existing server electric telemetry is never
    overwritten, and zero/unknown local energy is never promoted into history.
    """
    local_rows = [row for row in (local_trips or []) if isinstance(row, dict)]
    for trip in server_trips:
        if _number(trip.get("energy_kwh")) is not None:
            continue
        start_mileage = _number(trip.get("start_mileage"))
        distance = _number(trip.get("distance_km"))
        if start_mileage is None or distance is None or distance <= 0:
            continue

        candidates: list[tuple[float, dict[str, Any]]] = []
        trip_start = _parse_time(trip.get("start_time"))
        for local in local_rows:
            local_energy = _number(local.get("energy_kwh"))
            local_start_mileage = _number(local.get("start_mileage"))
            local_distance = _number(local.get("distance_km"))
            if (
                local_energy is None
                or local_energy <= 0
                or local_start_mileage is None
                or local_distance is None
            ):
                continue
            mileage_delta = abs(local_start_mileage - start_mileage)
            distance_delta = abs(local_distance - distance)
            if mileage_delta > 0.25 or distance_delta > 2.0:
                continue
            local_start = _parse_time(local.get("start_time"))
            time_delta = None
            if trip_start is not None and local_start is not None:
                time_delta = abs((trip_start - local_start).total_seconds())
                if time_delta > 20 * 60:
                    continue
            score = mileage_delta * 1000 + distance_delta * 100 + ((time_delta or 0) / 60)
            candidates.append((score, local))

        if not candidates:
            continue
        local = min(candidates, key=lambda item: item[0])[1]
        local_energy = _number(local.get("energy_kwh"))
        if local_energy is None or local_energy <= 0:
            continue

        trip["energy_kwh"] = round(local_energy, 3)
        trip["energy_per_100_km"] = round(local_energy / distance * 100, 2)
        trip["consumption_kwh_100km"] = trip["energy_per_100_km"]
        trip["energy_estimated"] = True
        trip["consumption_estimated"] = True
        trip["energy_source"] = "sv_local_trip_soc_delta"
        for key in ("soc_start", "soc_end", "capacity_kwh"):
            if trip.get(key) is None and local.get(key) is not None:
                trip[key] = local.get(key)
        fuel_used = (_number(trip.get("fuel_consumption_l")) or 0) > 0
        trip["trip_type"] = "hybrid" if fuel_used else "ev"
        trip["sources"] = list(dict.fromkeys([
            *(trip.get("sources") or [trip.get("source")]),
            "sv_local_trip",
        ]))
    return server_trips
'''
          history = history.replace(marker, helper + marker)
          old = '''        trips = repair_trip_odometer_continuity(trips, local_trips)
        by_id = {trip["id"]: trip for trip in trips if trip.get("id")}'''
          new = '''        trips = repair_trip_odometer_continuity(trips, local_trips)
        trips = enrich_trips_with_local_energy(trips, local_trips)
        by_id = {trip["id"]: trip for trip in trips if trip.get("id")}'''
          assert old in history
          history = history.replace(old, new)
          history_path.write_text(history)

          hybrid_test_path = Path('tests/hybrid-fuel-ui.test.mjs')
          hybrid_test = hybrid_test_path.read_text()
          hybrid_test = hybrid_test.replace('assert.match(trip, /const columnCount = hybridLayout \\? 6/);', 'assert.match(trip, /const columnCount = hybridLayout \\? 7/);')
          hybrid_test = hybrid_test.replace('assert.match(trip, /hybridLayout \\? html`<th>\\$\\{text\\.consumption\\}<\\/th><th>l\\/100 km<\\/th>`/);', 'assert.match(trip, /hybridLayout \\? html`<th>\\$\\{text\\.consumption\\}<\\/th><th>l\\/100 km<\\/th><th>\\$\\{dashboardText\\.powertrain\\}<\\/th>`/);')
          hybrid_test_path.write_text(hybrid_test)

          regression = r'''import assert from "node:assert/strict";
import fs from "node:fs";
import test from "node:test";

const read = (path) => fs.readFileSync(new URL(path, import.meta.url), "utf8");
const trip = read("../custom_components/sv_dashboard/static/trip-history-card.js");
const history = read("../custom_components/sv_dashboard/server_history.py");

test("single-energy trip history omits redundant powertrain column", () => {
  assert.match(trip, /const showTripType = hybridLayout/);
  assert.match(trip, /const columnCount = hybridLayout \? 7 : 4 \+ \(hasEnergy \? 2 : 0\) \+ \(hasFuel \? 1 : 0\) \+ \(hasMaxSpeed \? 1 : 0\)/);
  assert.doesNotMatch(trip, /hasTripType/);
});

test("dual-energy trip history keeps per-trip powertrain classification", () => {
  assert.match(trip, /hybridLayout \? html`<th>\$\{text\.consumption\}<\/th><th>l\/100 km<\/th><th>\$\{dashboardText\.powertrain\}<\/th>`/);
  assert.match(trip, /<span class="trip-type">\$\{\(\{ ev: "EV", hybrid: "Hybrid", ice: "ICE" \}\)\[trip\.attributes\?\.trip_type\] \|\| "—"\}<\/span>/);
});

test("canonical server trips recover only missing positive local electric energy", () => {
  assert.match(history, /def enrich_trips_with_local_energy\(/);
  assert.match(history, /if _number\(trip\.get\("energy_kwh"\)\) is not None:\n            continue/);
  assert.match(history, /local_energy <= 0/);
  assert.match(history, /mileage_delta > 0\.25/);
  assert.match(history, /distance_delta > 2\.0/);
  assert.match(history, /"energy_source"\] = "sv_local_trip_soc_delta"/);
  assert.match(history, /trips = enrich_trips_with_local_energy\(trips, local_trips\)/);
});
'''
          Path('tests/trip-history-regression.test.mjs').write_text(regression)
      - name: Validate focused candidate
        run: |
          python -m compileall -q custom_components/sv_dashboard
          node --check custom_components/sv_dashboard/static/trip-history-card.js
          node --test tests/*.test.mjs
      - name: Commit prepared fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-trip-history-fix.yml
          git add custom_components/sv_dashboard/static/trip-history-card.js custom_components/sv_dashboard/server_history.py tests/hybrid-fuel-ui.test.mjs tests/trip-history-regression.test.mjs
          git commit -m "fix: restore trip energy and capability-gate powertrain column"
          git push origin HEAD:fix/trip-history-energy-powertrain
