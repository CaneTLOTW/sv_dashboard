name: Finalize brand assets and i18n

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/finalize-brand-i18n.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build assets and consolidate frontend i18n
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          import json, re
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.')
          comp = root / 'custom_components/sv_dashboard'
          static = comp / 'static'

          # Version/cache bump for changed browser resources.
          manifest_path = comp / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '0.6.0-beta.3'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          for path in list(static.glob('*.js')) + list((root / 'tests').glob('*.mjs')) + [comp / 'const.py']:
              text = path.read_text()
              text = text.replace('0.6.0-beta.1', '0.6.0-beta.3').replace('0.6.0-beta.2', '0.6.0-beta.3')
              path.write_text(text)

          # Core DE/EN/FR now own their capability labels directly.
          p = static / 'i18n-core.js'
          text = p.read_text()
          replacements = {
              'heading: "Mobilität", chargingUntil: "bis {time}", charging: "Wird geladen", driving: "In Fahrt", battery: "Batterie",':
              'heading: "Mobilität", chargingUntil: "bis {time}", charging: "Wird geladen", driving: "In Fahrt", battery: "Batterie", fuel: "Kraftstoff",',
              'heading: "Mobility", chargingUntil: "until {time}", charging: "Charging", driving: "Driving", battery: "Battery",':
              'heading: "Mobility", chargingUntil: "until {time}", charging: "Charging", driving: "Driving", battery: "Battery", fuel: "Fuel",',
              'heading: "Mobilité", chargingUntil: "jusqu’à {time}", charging: "En charge", driving: "En trajet", battery: "Batterie",':
              'heading: "Mobilité", chargingUntil: "jusqu’à {time}", charging: "En charge", driving: "En trajet", battery: "Batterie", fuel: "Carburant",',
              'status: "Connection and setup status", vehicle: "Vehicle", overview: "Overview", live: "Live",':
              'status: "Connection and setup status", vehicle: "Vehicle", overview: "Overview", live: "Live", fuel: "Fuel", fuelRange: "Fuel range", fuelConsumption: "Fuel consumption",',
              'status: "Verbindungs- und Einrichtungsstatus", vehicle: "KFZ", overview: "Übersicht", live: "Live",':
              'status: "Verbindungs- und Einrichtungsstatus", vehicle: "KFZ", overview: "Übersicht", live: "Live", fuel: "Kraftstoff", fuelRange: "Kraftstoffreichweite", fuelConsumption: "Kraftstoffverbrauch",',
              'status: "État de la connexion et de la configuration", vehicle: "Véhicule", overview: "Vue d’ensemble", live: "Live",':
              'status: "État de la connexion et de la configuration", vehicle: "Véhicule", overview: "Vue d’ensemble", live: "En direct", fuel: "Carburant", fuelRange: "Autonomie carburant", fuelConsumption: "Consommation carburant",',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected i18n-core fragment: {old[:60]}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Remove the redundant central capability override; all 18 catalogs own these labels now.
          p = static / 'i18n.js'
          text = p.read_text()
          start = text.index('// Capability labels intentionally remain centrally owned')
          end = text.index('export { FRONTEND_TEXT, languageFor, localeFor, textFor };')
          text = text[:start] + '// Capability labels are owned by the per-language catalogs.\n\n' + text[end:]
          p.write_text(text)

          # Update the regression contract: source catalogs, not a central override, are canonical.
          p = root / 'tests/frontend-i18n.test.mjs'
          text = p.read_text()
          text = text.replace('const CAPABILITY_EXCEPTIONS = {\n  vehicleOverview: new Set(["fuel"]),\n  dashboard: new Set(["fuel", "fuelRange", "fuelConsumption"]),\n};', 'const CAPABILITY_EXCEPTIONS = {};')
          text = text.replace('test("capability labels remain centrally injected for every language", () => {', 'test("capability labels are sourced from the language catalogs for every language", () => {\n  assert.doesNotMatch(runtimeSource, /CAPABILITY_LABELS/);')
          p.write_text(text)

          # Generate Home Assistant local brand files from the already accepted neutral icon motif.
          brand = comp / 'brand'
          icon = Image.open(brand / 'icon.png').convert('RGBA')
          if icon.size[0] != icon.size[1]:
              raise SystemExit(f'icon must be square, got {icon.size}')
          icon.resize((512, 512), Image.Resampling.LANCZOS).save(brand / 'icon@2x.png', optimize=True)

          def font(size):
              candidates = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf',
              ]
              for candidate in candidates:
                  if Path(candidate).exists():
                      return ImageFont.truetype(candidate, size)
              return ImageFont.load_default()

          # Rectangular logo: same neutral icon + project name, transparent background.
          logo = Image.new('RGBA', (512, 192), (0, 0, 0, 0))
          mark = icon.resize((160, 160), Image.Resampling.LANCZOS)
          logo.alpha_composite(mark, (16, 16))
          draw = ImageDraw.Draw(logo)
          label = 'SV Dashboard'
          f = font(48)
          bbox = draw.textbbox((0, 0), label, font=f)
          y = (192 - (bbox[3] - bbox[1])) // 2 - bbox[1]
          draw.text((196, y), label, font=f, fill=(245, 245, 245, 255), stroke_width=2, stroke_fill=(25, 25, 25, 255))
          logo.save(brand / 'logo.png', optimize=True)
          logo.resize((1024, 384), Image.Resampling.LANCZOS).save(brand / 'logo@2x.png', optimize=True)

          master = icon.resize((1024, 1024), Image.Resampling.LANCZOS)
          assets = root / 'docs/assets'
          assets.mkdir(parents=True, exist_ok=True)
          master.save(assets / 'sv-dashboard-master.png', optimize=True)

          # Add a deterministic asset regression test (PNG header/dimensions only).
          test_path = root / 'tests/brand-assets.test.mjs'
          test_path.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst pngSize = (path) => {\n  const b = fs.readFileSync(new URL(path, import.meta.url));\n  assert.equal(b.subarray(1, 4).toString(), "PNG");\n  return [b.readUInt32BE(16), b.readUInt32BE(20)];\n};\n\ntest("SV Dashboard ships the complete local Home Assistant brand asset set", () => {\n  assert.deepEqual(pngSize("../custom_components/sv_dashboard/brand/icon.png"), [256, 256]);\n  assert.deepEqual(pngSize("../custom_components/sv_dashboard/brand/icon@2x.png"), [512, 512]);\n  assert.deepEqual(pngSize("../custom_components/sv_dashboard/brand/logo.png"), [512, 192]);\n  assert.deepEqual(pngSize("../custom_components/sv_dashboard/brand/logo@2x.png"), [1024, 384]);\n  assert.deepEqual(pngSize("../docs/assets/sv-dashboard-master.png"), [1024, 1024]);\n});\n''')
          PY
      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sv_dashboard tests docs/assets/sv-dashboard-master.png
          git commit -m "feat: finalize SV branding and frontend i18n"
          git push origin HEAD:develop
