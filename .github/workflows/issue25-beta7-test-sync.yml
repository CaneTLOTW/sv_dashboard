name: Issue 25 beta7 escaped test sync

on:
  push:
    branches:
      - issue-25-beta7
    paths:
      - .github/workflows/issue25-beta7-test-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-25-beta7
          fetch-depth: 0

      - name: Update escaped release assertions only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patterns = [
              (r"0\.6\.0-beta\.6", r"0\.6\.0-beta\.7"),
              (r"0\\.6\\.0-beta\\.6", r"0\\.6\\.0-beta\\.7"),
          ]
          changed = []
          replacements = 0
          for path in Path("tests").rglob("*.mjs"):
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in patterns:
                  count = text.count(old)
                  replacements += count
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          if replacements < 7:
              raise SystemExit(f"Unexpectedly few escaped beta.6 assertions replaced: {replacements}")

          leftovers = []
          for path in Path("tests").rglob("*.mjs"):
              text = path.read_text(encoding="utf-8")
              if any(old in text for old, _ in patterns):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit(f"Escaped beta.6 assertions remain: {leftovers}")

          print(f"Replaced {replacements} escaped beta.6 assertions in {len(changed)} test files")
          for path in changed:
              print(path)
          PY

          rm -f .github/workflows/issue25-beta7-test-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests .github/workflows/issue25-beta7-test-sync.yml
          git diff --cached --check
          git commit -m "test: sync beta.7 cache assertions"
          git push origin HEAD:issue-25-beta7
