name: One-shot migration test fix

on:
  push:
    branches: [migration-phase1]
    paths: [.test-fix-trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: migration-phase1
          fetch-depth: 2
      - name: Normalize migrated tests and active identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in Path('tests').glob('*.mjs'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('0\\.5\\.54', '0\\.6\\.0-beta\\.1')
              text = text.replace('0.5.54', '0.6.0-beta.1')
              text = text.replace('e-c3-', 'sv-')
              path.write_text(text, encoding='utf-8')

          for path in Path('custom_components/sv_dashboard').rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.ico'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text = text.replace('e-c3-', 'sv-')
              text = text.replace('e-C3', 'SV')
              path.write_text(text, encoding='utf-8')
          PY
          rm -f tests/prepared-patch-format.test.mjs
          rm -f .test-fix-trigger

          if grep -RIl --exclude-dir=.git -E 'e_c3_dashboard|e-C3 Dashboard|e-c3-' custom_components tests hacs.json; then
            echo 'Active old identifier remains'; exit 1
          fi
          python3 -m py_compile custom_components/sv_dashboard/*.py
          node --test tests/*.test.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'test: normalize SV migration expectations'
          git push origin HEAD:migration-phase1
