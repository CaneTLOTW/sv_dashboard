name: One-shot beta9 release

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/one-shot-beta9-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable beta9 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v0.6.0-beta.9
          TARGET_SHA: 65ee0f1f0a83e9997c68e84f3cad1be2416a1630
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$TARGET_SHA" \
            --prerelease \
            --title "SV Dashboard v0.6.0-beta.9" \
            --notes "Owner/runtime-QA candidate for the native Dual-Energy Hero interactions. Exact source SHA: $TARGET_SHA. Vehicle image opens the generated vehicle dashboard; temperature, Battery/Fuel percentages and the currently displayed range/trip-energy/charge-power/fuel-consumption metric open Home Assistant native More Info/history. The Hero remains native Lit with no nested custom:button-card. Owner-approved large vehicle sizing is carried into product CSS while Battery/Fuel remain on the symmetric native grid. The localization path was audited across the existing 18-language contract, hard-coded AC/Vehicle fallbacks were removed, and the reviewed French PR #20 terminology corrections are included. Final develop Validate run 33908777204 = PASS (Source/frontend, Hassfest, HACS). This remains a prerelease for owner and DS4 external QA; main is not promoted."
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,targetCommitish,url
