name: One-shot beta4 release

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/one-shot-beta4-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable beta4 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v0.6.0-beta.4
          TARGET_SHA: e3a259f2257c514784cb07058a90e09a40ea6a66
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$TARGET_SHA" \
            --prerelease \
            --title "SV Dashboard v0.6.0-beta.4" \
            --notes "Owner/live-test candidate for the hybrid UI expansion. Exact source SHA: $TARGET_SHA. Adds the standalone dual-energy vehicle overview card, hybrid fuel metrics in trip history, and fuel/refill history support. Missing fuel values remain empty rather than being invented. Final Validate run 33635429352 = PASS (Source/Frontend, Hassfest, HACS). Install as a pre-release for parallel validation; no stable/main promotion."
          gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,targetCommitish,url
