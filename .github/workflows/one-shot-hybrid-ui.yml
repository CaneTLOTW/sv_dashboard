name: One-shot hybrid UI implementation

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/one-shot-hybrid-ui.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Bump beta and load standalone cards
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path); text = p.read_text(); count = text.count(old)
              if count != 1: raise SystemExit(f"{path}: expected one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))
          for p in Path("custom_components/sv_dashboard/static").glob("*.js"):
              text = p.read_text()
              if "0.6.0-beta.3" in text: p.write_text(text.replace("0.6.0-beta.3", "0.6.0-beta.4"))
          replace_once("custom_components/sv_dashboard/const.py", 'FRONTEND_VERSION = "0.6.0-beta.3"', 'FRONTEND_VERSION = "0.6.0-beta.4"')
          replace_once("custom_components/sv_dashboard/manifest.json", '"version": "0.6.0-beta.3"', '"version": "0.6.0-beta.4"')
          replace_once("custom_components/sv_dashboard/static/frontend.js", '  import("./vehicle-overview-card.js?v=0.6.0-beta.4"),\n', '  import("./vehicle-overview-card.js?v=0.6.0-beta.4"),\n  import("./dual-energy-overview-card.js?v=0.6.0-beta.4"),\n  import("./fuel-history-card.js?v=0.6.0-beta.4"),\n')
          PY

      - name: Extend canonical trip history with fuel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("custom_components/sv_dashboard/server_history.py"); text=p.read_text()
          def r(old,new):
              global text
              count=text.count(old)
              if count!=1: raise SystemExit(f"server_history.py expected one match, got {count}: {old[:100]!r}")
              text=text.replace(old,new,1)
          r('''def _energy_entry(values: Any) -> dict[str, Any] | None:\n    if not isinstance(values, list):\n        return None\n    return next(\n        (item for item in values if isinstance(item, dict) and item.get("type") == "Electric"),\n        None,\n    )\n''','''def _energy_entry(\n    values: Any, energy_type: str = "Electric"\n) -> dict[str, Any] | None:\n    """Return one typed energy entry without conflating powertrains."""\n    if not isinstance(values, list):\n        return None\n    return next(\n        (item for item in values if isinstance(item, dict) and item.get("type") == energy_type),\n        None,\n    )\n''')
          r('''    start_soc, end_soc = _trip_soc(raw, "startEnergies"), _trip_soc(raw, "endEnergies")\n    capacity = _capacity(capacity_kwh)\n\n    electric_consumption = _energy_entry(raw.get("energyConsumptions"))\n''','''    start_soc, end_soc = _trip_soc(raw, "startEnergies"), _trip_soc(raw, "endEnergies")\n    start_fuel = _energy_entry(raw.get("startEnergies"), "Fuel")\n    end_fuel = _energy_entry(raw.get("endEnergies"), "Fuel")\n    fuel_level_start = _number(start_fuel.get("level")) if start_fuel else None\n    fuel_level_end = _number(end_fuel.get("level")) if end_fuel else None\n    fuel_range_start_km = _number(start_fuel.get("autonomy")) if start_fuel else None\n    fuel_range_end_km = _number(end_fuel.get("autonomy")) if end_fuel else None\n    capacity = _capacity(capacity_kwh)\n\n    electric_consumption = _energy_entry(raw.get("energyConsumptions"))\n''')
          r('''    if energy_kwh is None:\n        energy_source = "not_reliable_short_or_no_soc_change"\n\n    kinetic = raw.get("kinetic") if isinstance(raw.get("kinetic"), dict) else {}\n''','''    if energy_kwh is None:\n        energy_source = "not_reliable_short_or_no_soc_change"\n\n    fuel_consumption = _energy_entry(raw.get("energyConsumptions"), "Fuel")\n    raw_fuel_consumption = _number(fuel_consumption.get("consumption")) if fuel_consumption else None\n    raw_fuel_average = _number(fuel_consumption.get("avgConsumption")) if fuel_consumption else None\n    # Upstream Stellantis Vehicles interprets Fuel trip values with /100:\n    # consumption -> liters, avgConsumption -> l/100 km. Preserve a real zero.\n    fuel_consumption_l = round(raw_fuel_consumption / 100, 3) if raw_fuel_consumption is not None and raw_fuel_consumption >= 0 else None\n    fuel_consumption_l_100km = round(raw_fuel_average / 100, 2) if raw_fuel_average is not None and raw_fuel_average >= 0 else None\n    if fuel_consumption_l_100km is None and fuel_consumption_l is not None and distance is not None and distance > 0:\n        fuel_consumption_l_100km = round(fuel_consumption_l / distance * 100, 2)\n\n    electric_used = bool((energy_kwh is not None and energy_kwh > 0) or (start_soc is not None and end_soc is not None and end_soc < start_soc))\n    fuel_used = fuel_consumption_l is not None and fuel_consumption_l > 0\n    trip_type = "hybrid" if electric_used and fuel_used else "ice" if fuel_used else "ev" if electric_used else "unknown"\n\n    kinetic = raw.get("kinetic") if isinstance(raw.get("kinetic"), dict) else {}\n''')
          r('''        "soc_start": start_soc,\n        "soc_end": end_soc,\n        "capacity_kwh": capacity,\n''','''        "soc_start": start_soc,\n        "soc_end": end_soc,\n        "fuel_level_start": fuel_level_start,\n        "fuel_level_end": fuel_level_end,\n        "fuel_range_start_km": fuel_range_start_km,\n        "fuel_range_end_km": fuel_range_end_km,\n        "fuel_consumption_l": fuel_consumption_l,\n        "fuel_consumption_l_100km": fuel_consumption_l_100km,\n        "trip_type": trip_type,\n        "capacity_kwh": capacity,\n''')
          p.write_text(text)
          PY

      - name: Publish fuel fields in compact trip sensor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("custom_components/sv_dashboard/sensor.py"); text=p.read_text()
          old='''            "soc_start",\n            "soc_end",\n            "energy_kwh",\n'''; new='''            "soc_start",\n            "soc_end",\n            "fuel_level_start",\n            "fuel_level_end",\n            "fuel_range_start_km",\n            "fuel_range_end_km",\n            "fuel_consumption_l",\n            "fuel_consumption_l_100km",\n            "trip_type",\n            "energy_kwh",\n'''
          if text.count(old)!=1: raise SystemExit(f"compact row match count {text.count(old)}")
          text=text.replace(old,new,1)
          old='''    "soc_start",\n    "soc_end",\n    "energy_kwh",\n'''; new='''    "soc_start",\n    "soc_end",\n    "fuel_level_start",\n    "fuel_level_end",\n    "fuel_range_start_km",\n    "fuel_range_end_km",\n    "fuel_consumption_l",\n    "fuel_consumption_l_100km",\n    "trip_type",\n    "energy_kwh",\n'''
          if text.count(old)!=1: raise SystemExit(f"column tuple match count {text.count(old)}")
          p.write_text(text.replace(old,new,1))
          PY

      - name: Extend existing trip history UI for hybrid trips
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("custom_components/sv_dashboard/static/trip-history-card.js"); text=p.read_text()
          def r(old,new):
              global text
              count=text.count(old)
              if count!=1: raise SystemExit(f"trip-history-card.js expected one match, got {count}: {old[:100]!r}")
              text=text.replace(old,new,1)
          r('''        .quality-warning { flex: 1 0 100%; color: var(--warning-color, var(--primary-text-color)); font-weight: 600; }\n''','''        .quality-warning { flex: 1 0 100%; color: var(--warning-color, var(--primary-text-color)); font-weight: 600; }\n        .trip-type { display: inline-flex; align-items: center; min-height: 20px; padding: 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--primary-color) 10%, transparent); font-size: 11px; font-weight: 600; }\n''')
          r('''            if (this._onlyConsumption && (!Number.isFinite(Number(trip.energy_kwh)) || Number(trip.energy_kwh) <= 0)) return false;\n''','''            if (this._onlyConsumption) {\n                const electric = trip.energy_kwh !== null && trip.energy_kwh !== undefined && Number(trip.energy_kwh) > 0;\n                const fuel = trip.fuel_consumption_l !== null && trip.fuel_consumption_l !== undefined && Number(trip.fuel_consumption_l) > 0;\n                if (!electric && !fuel) return false;\n            }\n''')
          r('''    _text() {\n        return textFor(this._i18nContext(), "tripHistory");\n    }\n''','''    _text() {\n        return textFor(this._i18nContext(), "tripHistory");\n    }\n\n    _dashboardText() {\n        return textFor(this._i18nContext(), "dashboard");\n    }\n''')
          r('''        const text = this._text();\n        const trips = this._trips ?? [];\n        const hasMoreTrips = (this._allTrips?.length ?? 0) > trips.length;\n        const hasMaxSpeed = trips.some((trip) => trip.attributes?.max_speed);\n        const hasEnergy = trips.some((trip) => trip.attributes?.energy_kwh !== undefined);\n        const columnCount = 4 + (hasEnergy ? 2 : 0) + (hasMaxSpeed ? 1 : 0);\n''','''        const text = this._text();\n        const dashboardText = this._dashboardText();\n        const trips = this._trips ?? [];\n        const hasMoreTrips = (this._allTrips?.length ?? 0) > trips.length;\n        const hasMaxSpeed = trips.some((trip) => trip.attributes?.max_speed);\n        const hasEnergy = trips.some((trip) => trip.attributes?.energy_kwh !== undefined && trip.attributes?.energy_kwh !== null);\n        const hasFuel = trips.some((trip) => trip.attributes?.fuel_consumption_l_100km !== undefined && trip.attributes?.fuel_consumption_l_100km !== null);\n        const hasTripType = trips.some((trip) => trip.attributes?.trip_type && trip.attributes.trip_type !== "unknown");\n        const columnCount = 4 + (hasEnergy ? 2 : 0) + (hasFuel ? 1 : 0) + (hasTripType ? 1 : 0) + (hasMaxSpeed ? 1 : 0);\n''')
          r('''                            <table class="trip-table"><thead><tr><th>${text.date}</th><th>${text.duration}</th><th>${text.distance}</th><th>${text.average}</th>${hasEnergy ? html`<th>${text.energy}</th><th>${text.consumption}</th>` : nothing}${hasMaxSpeed ? html`<th>${text.maximum}</th>` : nothing}</tr></thead>\n''','''                            <table class="trip-table"><thead><tr><th>${text.date}</th><th>${text.duration}</th><th>${text.distance}</th><th>${text.average}</th>${hasEnergy ? html`<th>${text.energy}</th><th>${text.consumption}</th>` : nothing}${hasFuel ? html`<th>l/100 km</th>` : nothing}${hasTripType ? html`<th>${dashboardText.powertrain}</th>` : nothing}${hasMaxSpeed ? html`<th>${text.maximum}</th>` : nothing}</tr></thead>\n''')
          r('''                                ${hasEnergy ? html`<td>${this._value(trip.attributes?.energy_kwh)}</td><td>${invalid ? "—" : this._value(trip.attributes?.energy_per_100_km)}</td>` : nothing}\n                                ${hasMaxSpeed ? html`<td>${invalid ? "—" : this._value(trip.attributes?.max_speed)}</td>` : nothing}\n''','''                                ${hasEnergy ? html`<td>${this._value(trip.attributes?.energy_kwh)}</td><td>${invalid ? "—" : this._value(trip.attributes?.energy_per_100_km)}</td>` : nothing}\n                                ${hasFuel ? html`<td>${invalid ? "—" : this._value(trip.attributes?.fuel_consumption_l_100km)}</td>` : nothing}\n                                ${hasTripType ? html`<td><span class="trip-type">${({ ev: "EV", hybrid: "Hybrid", ice: "ICE" })[trip.attributes?.trip_type] || "—"}</span></td>` : nothing}\n                                ${hasMaxSpeed ? html`<td>${invalid ? "—" : this._value(trip.attributes?.max_speed)}</td>` : nothing}\n''')
          r('''                                        <span><strong>${text.socStart}:</strong> ${this._value(trip.attributes?.soc_start)} %</span>\n                                        <span><strong>${text.socEnd}:</strong> ${this._value(trip.attributes?.soc_end)} %</span>\n''','''                                        ${(trip.attributes?.soc_start !== null && trip.attributes?.soc_start !== undefined) || (trip.attributes?.soc_end !== null && trip.attributes?.soc_end !== undefined) ? html`<span><strong>${text.socStart} / ${text.socEnd}:</strong> ${this._value(trip.attributes?.soc_start)} % → ${this._value(trip.attributes?.soc_end)} %</span>` : nothing}\n                                        ${(trip.attributes?.fuel_level_start !== null && trip.attributes?.fuel_level_start !== undefined) || (trip.attributes?.fuel_level_end !== null && trip.attributes?.fuel_level_end !== undefined) ? html`<span><strong>${dashboardText.fuel}:</strong> ${this._value(trip.attributes?.fuel_level_start)} % → ${this._value(trip.attributes?.fuel_level_end)} %</span>` : nothing}\n                                        ${(trip.attributes?.fuel_range_start_km !== null && trip.attributes?.fuel_range_start_km !== undefined) || (trip.attributes?.fuel_range_end_km !== null && trip.attributes?.fuel_range_end_km !== undefined) ? html`<span><strong>${dashboardText.fuelRange}:</strong> ${this._value(trip.attributes?.fuel_range_start_km)} km → ${this._value(trip.attributes?.fuel_range_end_km)} km</span>` : nothing}\n                                        ${trip.attributes?.fuel_consumption_l !== null && trip.attributes?.fuel_consumption_l !== undefined ? html`<span><strong>${dashboardText.fuelConsumption}:</strong> ${this._value(trip.attributes?.fuel_consumption_l)} l · ${this._value(trip.attributes?.fuel_consumption_l_100km)} l/100 km</span>` : nothing}\n''')
          p.write_text(text)
          PY

      - name: Add fuel history to fuel-capable generated dashboards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("custom_components/sv_dashboard/static/sv_dashboard.js"); text=p.read_text()
          marker='        modules.charging && supportsChargeHistory ? { type: "custom:sv-dashboard-charge-history-card",'
          insert='        modules.trips && supportsFuel ? { type: "custom:sv-dashboard-fuel-history-card", entry_id: attributes.entry_id, fuel_entity: entity("fuel"), hours_to_show: historyHours, max_events: 50, grid_options: { columns: "full" } } : null,\n'
          if text.count(marker)!=1: raise SystemExit(f"vehicle insertion marker count {text.count(marker)}")
          text=text.replace(marker,insert+marker,1)
          marker='            { type: "custom:sv-dashboard-trip-history-card", entity: lastTripDisplayEntity, server_entity: serverTripEntity, trip_entities: [nativeLastTrip].filter(Boolean), energy_entities: supportsElectric ? [lastTripResult].filter(Boolean) : [], title: strings.tripHistory, language: language(hass), hours_to_show: historyHours, expanded_window: true, initial_visible_trips: 100, max_trips: 0, grid_options: { columns: "full", rows: 10 } },\n'
          insert=marker+'            supportsFuel ? { type: "custom:sv-dashboard-fuel-history-card", entry_id: attributes.entry_id, fuel_entity: entity("fuel"), hours_to_show: historyHours, max_events: 100, grid_options: { columns: "full", rows: 5 } } : null,\n'
          if text.count(marker)!=1: raise SystemExit(f"trips insertion marker count {text.count(marker)}")
          p.write_text(text.replace(marker,insert,1))
          PY

      - name: Tune refill-history recorder query
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("custom_components/sv_dashboard/static/fuel-history-card.js"); text=p.read_text()
          text=text.replace("hours_to_show: 8760", "hours_to_show: 2160")
          text=text.replace("Number(this._config.hours_to_show) || 8760", "Number(this._config.hours_to_show) || 2160")
          text=text.replace("this._hass.states?.[fuel]?.last_updated", "this._hass.states?.[fuel]?.last_changed")
          text=text.replace('refill ? this._hass.states?.[refill]?.last_updated : ""', 'refill ? this._hass.states?.[refill]?.last_changed : ""')
          text=text.replace("significant_changes_only: false", "significant_changes_only: true")
          p.write_text(text)
          PY

      - name: Add feature contract tests
        run: |
          cat > tests/hybrid-fuel-ui.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";
          const history=fs.readFileSync(new URL("../custom_components/sv_dashboard/server_history.py",import.meta.url),"utf8");
          const sensor=fs.readFileSync(new URL("../custom_components/sv_dashboard/sensor.py",import.meta.url),"utf8");
          const trip=fs.readFileSync(new URL("../custom_components/sv_dashboard/static/trip-history-card.js",import.meta.url),"utf8");
          const fuelHistory=fs.readFileSync(new URL("../custom_components/sv_dashboard/static/fuel-history-card.js",import.meta.url),"utf8");
          const dualHero=fs.readFileSync(new URL("../custom_components/sv_dashboard/static/dual-energy-overview-card.js",import.meta.url),"utf8");
          const frontend=fs.readFileSync(new URL("../custom_components/sv_dashboard/static/frontend.js",import.meta.url),"utf8");
          const strategy=fs.readFileSync(new URL("../custom_components/sv_dashboard/static/sv_dashboard.js",import.meta.url),"utf8");
          const languages=["de","en","fr","it","es","pt","nl","da","nb","sv","fi","pl","cs","sk","hu","ro","sl","hr"];
          test("canonical trips preserve independent fuel telemetry",()=>{assert.match(history,/_energy_entry\(raw\.get\("energyConsumptions"\), "Fuel"\)/);for(const key of ["fuel_level_start","fuel_level_end","fuel_range_start_km","fuel_range_end_km","fuel_consumption_l","fuel_consumption_l_100km","trip_type"]){assert.match(history,new RegExp(`"${key}"`));assert.match(sensor,new RegExp(`"${key}"`));}assert.match(history,/raw_fuel_consumption \/ 100/);});
          test("existing trip history expands for hybrid data",()=>{assert.match(trip,/const hasFuel = trips\.some/);assert.match(trip,/l\/100 km/);assert.match(trip,/trip-type/);assert.match(trip,/dashboardText\.fuelRange/);assert.match(trip,/ev: "EV", hybrid: "Hybrid", ice: "ICE"/);});
          test("dual-energy hero is standalone and responsive",()=>{assert.match(dualHero,/sv-dashboard-dual-energy-overview-card/);assert.match(dualHero,/grid-template-areas: "battery vehicle fuel"/);assert.match(dualHero,/@media \(max-width: 680px\)/);assert.match(dualHero,/mapped\.fuel_autonomy/);assert.doesNotMatch(dualHero,/Parkt|aktualisiert vor/);});
          test("fuel history does not invent refill liters",()=>{assert.match(fuelHistory,/increase < minimum/);assert.match(fuelHistory,/fuel_refill_amount/);assert.doesNotMatch(fuelHistory,/fuel_consumption_total/);assert.match(fuelHistory,/event\.liters === null \? "—"/);});
          test("new card strings cover 18 languages",()=>{for(const language of languages){assert.match(dualHero,new RegExp(`\\n  ${language}: \\{`));assert.match(fuelHistory,new RegExp(`\\n  ${language}: \\{`));}});
          test("frontend loads new cards and fuel history is capability gated",()=>{assert.match(frontend,/dual-energy-overview-card\.js\?v=0\.6\.0-beta\.4/);assert.match(frontend,/fuel-history-card\.js\?v=0\.6\.0-beta\.4/);assert.match(strategy,/modules\.trips && supportsFuel \? \{ type: "custom:sv-dashboard-fuel-history-card"/);});
          EOF

      - name: Run source and frontend regression tests
        run: |
          python -m compileall -q custom_components/sv_dashboard
          for file in custom_components/sv_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sv_dashboard tests/hybrid-fuel-ui.test.mjs
          git commit -m "feat: add hybrid dual-energy and fuel history UI"
          git push origin HEAD:develop
