name: Bootstrap community wiki and discussions

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/community-bootstrap.yml

permissions:
  contents: write
  discussions: write

jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Try to enable Discussions
        id: discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method PATCH "repos/${REPO}" -f has_discussions=true
      - name: Build Wiki front door
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git" wiki
          cd wiki
          cat > Home.md <<'EOF'
          # SV Dashboard

          **Stellantis Vehicle Dashboard for Home Assistant**

          SV Dashboard is a capability-driven Home Assistant dashboard integration for vehicles exposed by the upstream Stellantis Vehicles integration.

          ## Start here

          - [[Installation-and-Migration]] — HACS installation, beta policy and safe parallel migration.
          - [[Vehicle-Testing]] — how to validate a new vehicle, brand or powertrain.
          - [[Compatibility-and-Powertrains]] — Electric, Hybrid and Thermic capability behavior and validation status.
          - [[Notifications-and-Push]] — notification setup and runtime QA.

          ## Current validation terminology

          - **Expected / upstream-supported** — upstream support exists; no real SV vehicle validation yet.
          - **Beta testing** — a real vehicle/tester is validating an immutable SV beta.
          - **Confirmed** — the relevant dashboard surfaces have passed real-vehicle validation without a known release-blocking model-specific defect.

          Detailed technical documentation in the repository `/docs` directory is canonical. This Wiki is intentionally a short navigation/community layer so information does not drift between two independent manuals.
          EOF

          cat > Installation-and-Migration.md <<'EOF'
          # Installation and migration

          Install SV Dashboard through HACS as an **Integration** and restart Home Assistant before adding it under **Settings → Devices & services**.

          External beta tests use an immutable published pre-release/version, never a moving `develop` branch.

          ## Safe parallel migration

          SV Dashboard can be installed alongside its predecessor for comparison:

          - separate Home Assistant domain: `sv_dashboard`;
          - separate config entries;
          - separate package-owned `sv_...` entity namespace;
          - separate local metric/history/notification stores;
          - separate generated dashboard.

          Available Stellantis/server history is fetched again and SV-local derived history/statistics are rebuilt independently. Remove the predecessor only after the new dashboard, history and controls have passed the desired checks.

          Canonical documentation:

          - repository `docs/INSTALLATION.en.md`
          - repository `docs/VEHICLE_VALIDATION.en.md`
          EOF

          cat > Vehicle-Testing.md <<'EOF'
          # Vehicle testing

          Use the canonical repository guide `docs/VEHICLE_VALIDATION.en.md` for the full procedure and test-report template.

          Every real-vehicle report should identify:

          - brand/model and powertrain;
          - Home Assistant version;
          - Stellantis Vehicles version;
          - SV Dashboard version/pre-release;
          - UI language;
          - fresh or parallel migration install.

          Universal checks cover dashboard rendering, history rebuild, Trips, GPS/positions, Statistics, restart persistence, entity namespace and absence of unsupported controls.

          ## Powertrain focus

          - **Electric:** SOC/range, charging state/power/history, battery/SOH where available, conditioning and wake-up.
          - **Hybrid:** electric and fuel data together, charging only when exposed, per-vehicle battery-capacity fallback, no invented residual/capacity, SOH when available.
          - **Thermic:** fuel-first presentation, no traction-battery/charging UI, universal Trips/GPS/System still useful.

          Also test notification/push wording and the tester's actual UI language where practical. Screenshots are welcome after VIN, account data and private locations are redacted.
          EOF

          cat > Compatibility-and-Powertrains.md <<'EOF'
          # Compatibility and powertrains

          SV Dashboard follows the capabilities exposed by **Stellantis Vehicles** instead of hard-coding model-specific dashboards.

          Current upstream-facing brand scope includes Citroën, Peugeot, DS Automobiles, Opel and Vauxhall. Real SV validation is tracked separately from expected upstream compatibility.

          ## Status categories

          - **Expected / upstream-supported** — architecture should support it; real SV test pending.
          - **Beta testing** — immutable beta assigned to a real vehicle/tester.
          - **Confirmed** — real-vehicle dashboard validation passed.

          ## Powertrains

          - **Electric** — electric SOC/range/charging/energy features when upstream data exists.
          - **Hybrid** — electric and fuel capabilities are independent and may coexist.
          - **Thermic / combustion** — fuel state and consumption where available; EV-only controls stay hidden.
          - **Hydrogen / unknown** — defensive capability handling only; no blanket support claim.

          Canonical matrix: repository `docs/VEHICLE_CAPABILITY_MATRIX.en.md`.
          EOF

          cat > Notifications-and-Push.md <<'EOF'
          # Notifications and push

          Notification controls are opt-in. Select explicit Home Assistant Notify recipients and then enable the desired reports/warnings.

          Runtime validation should cover:

          - selected recipients only;
          - settings persistence across reload/restart;
          - test notification;
          - trip and charging reports where applicable;
          - range/vehicle/availability warnings;
          - quiet-hours deferral and recovery handling;
          - heartbeat/outage/recovery behavior;
          - duplicate suppression;
          - localized push wording.

          The same 18-language maintenance rules apply to backend notification text as to the rest of SV Dashboard.

          Canonical documentation: repository `docs/NOTIFICATIONS_AND_WAKEUP.en.md`. Active runtime QA is tracked in issue #3.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: build SV Dashboard wiki front door" || true
          git push origin HEAD:master

      - name: Create compatibility Discussion if Discussions are enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/${REPO}" --jq '.has_discussions')
          if [ "$enabled" != "true" ]; then
            echo "Discussions are not enabled; leaving prepared body in issue #13."
            exit 0
          fi
          repo_id=$(gh api graphql -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id}}' -f owner="${REPO%/*}" -f name="${REPO#*/}" --jq '.data.repository.id')
          category_id=$(gh api graphql -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){discussionCategories(first:20){nodes{id name slug}}}}' -f owner="${REPO%/*}" -f name="${REPO#*/}" --jq '.data.repository.discussionCategories.nodes | map(select(.slug=="general" or .name=="General"))[0].id')
          body=$(cat <<'EOF'
          Use this thread for real-world SV Dashboard compatibility reports, screenshots, translation feedback and early testing observations.

          Start with the canonical [Vehicle validation guide](https://github.com/CaneTLOTW/sv_dashboard/blob/develop/docs/VEHICLE_VALIDATION.en.md) and [Community guide](https://github.com/CaneTLOTW/sv_dashboard/blob/develop/docs/COMMUNITY.en.md).

          **Status terms:** Expected / upstream-supported → Beta testing → Confirmed.

          Please include brand/model/powertrain, Home Assistant version, Stellantis Vehicles version, SV Dashboard version/pre-release and UI language. Distinguish between an upstream entity existing, SV rendering it correctly, Home Assistant accepting a command, and the physical vehicle actually performing the command.

          Screenshots are welcome after VIN, private location and account/recipient details are redacted. Translation corrections should be short and technically precise. Notifications/push testing is also useful where practical.

          Reproducible SV Dashboard defects should become GitHub Issues. External testing should always use an immutable published beta/pre-release rather than a moving `develop` branch.
          EOF
          )
          gh api graphql -f query='mutation($repo:ID!,$cat:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repo,categoryId:$cat,title:$title,body:$body}){discussion{url}}}' -f repo="$repo_id" -f cat="$category_id" -f title='Vehicle compatibility & beta testing — report your Stellantis model' -f body="$body"
