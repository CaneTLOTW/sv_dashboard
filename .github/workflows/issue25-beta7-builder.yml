name: Issue 25 beta7 builder

on:
  push:
    branches:
      - issue-25-beta7
    paths:
      - .github/workflows/issue25-beta7-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-25-beta7
          fetch-depth: 0

      - name: Synchronize beta.7 runtime and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "0.6.0-beta.6"
          new = "0.6.0-beta.7"
          roots = [Path("custom_components/sv_dashboard"), Path("tests")]
          changed = []
          replacements = 0
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".py", ".js", ".mjs", ".json", ".md"}:
                      continue
                  text = path.read_text(encoding="utf-8")
                  count = text.count(old)
                  if not count:
                      continue
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  replacements += count
                  changed.append(str(path))
          if replacements < 10:
              raise SystemExit(f"Unexpectedly few beta version replacements: {replacements}")

          leftovers = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".py", ".js", ".mjs", ".json", ".md"}:
                      continue
                  if old in path.read_text(encoding="utf-8"):
                      leftovers.append(str(path))
          if leftovers:
              raise SystemExit(f"Stale beta.6 references remain: {leftovers}")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## 0.6.0-beta.6 owner visual QA"
          section = '''## 0.6.0-beta.7 dynamic Dual-Energy hero\n\n- Enlarged the vehicle hero and reduced unused whitespace in the wide Battery/Fuel overview.\n- Added mapped preconditioning/AC control at the top-left and live vehicle temperature at the top-right.\n- Battery presentation is state-driven: green EV range while idle, blue current-trip energy in kWh while driving, and a blue pulsing charge-power view while charging.\n- The driving hero deliberately uses current-trip energy, not a synthesized kWh/100 km value.\n- Hybrid Fuel can show current upstream l/100 km while driving only when that value was refreshed during the current drive; otherwise Fuel range remains visible.\n- Preserved neutral missing-Fuel values for EV owner QA and extended all 18 frontend languages for the new hero labels.\n\n'''
          if section not in text:
              if marker not in text:
                  raise SystemExit("Could not find beta.6 changelog marker")
              text = text.replace(marker, section + marker, 1)
              changelog.write_text(text, encoding="utf-8")

          print(f"Replaced {replacements} beta.6 references across {len(changed)} runtime/test files")
          for path in changed:
              print(path)
          PY

          rm -f .github/workflows/issue25-beta7-builder.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sv_dashboard tests CHANGELOG.md .github/workflows/issue25-beta7-builder.yml
          git diff --cached --check
          git commit -m "chore: prepare v0.6.0-beta.7 owner QA"
          git push origin HEAD:issue-25-beta7
