name: One-shot beta6 version sync

on:
  push:
    branches:
      - issue-22-beta6

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-22-beta6
          fetch-depth: 0
      - name: Synchronize beta.6 package/cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "0.6.0-beta.5"
          new = "0.6.0-beta.6"
          roots = [Path("custom_components/sv_dashboard"), Path("tests")]
          changed = []
          replacements = 0
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".py", ".js", ".json", ".mjs"}:
                      continue
                  text = path.read_text(encoding="utf-8")
                  count = text.count(old)
                  if not count:
                      continue
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  replacements += count
                  changed.append(str(path))

          if replacements == 0:
              raise SystemExit("No beta.5 references found to update")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## 0.6.0-beta.6 owner visual QA"
          if heading not in text:
              marker = "## 0.6.0-beta.5 candidate hardening"
              section = (
                  "## 0.6.0-beta.6 owner visual QA\n\n"
                  "- Fixed dual-energy hero clipping when Home Assistant placed the card in a narrow grid cell.\n"
                  "- The card now requests the native 12-column wide grid size and responds to its own container width instead of the browser viewport.\n"
                  "- EV owner acceptance keeps the fuel side visible with neutral missing values rather than hiding or fabricating telemetry.\n"
                  "- Enlarged the vehicle presentation and added neutral battery/fuel percentage fill bars.\n\n"
              )
              if marker not in text:
                  raise SystemExit("CHANGELOG beta.5 marker missing")
              changelog.write_text(text.replace(marker, section + marker, 1), encoding="utf-8")

          print(f"Updated {replacements} beta.5 references across {len(changed)} files")
          for item in changed:
              print(item)
          PY
      - name: Remove one-shot workflow and commit candidate
        run: |
          rm .github/workflows/one-shot-beta6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare beta.6 owner candidate"
          git push origin HEAD:issue-22-beta6
