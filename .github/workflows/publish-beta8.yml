name: Publish beta.8 prerelease

on:
  push:
    branches:
      - release/v0.6.0-beta.8
    paths:
      - .github/workflows/publish-beta8.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable beta.8 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: cf1c9f9272045fab6b529135ec7df5b24d90e0d4
          TAG: v0.6.0-beta.8
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "SV Dashboard v0.6.0-beta.8" \
            --prerelease \
            --notes "Owner Hero polish follow-up to beta.7.\n\n- Removes the redundant visible AC caption beneath the climate icon while preserving the existing mapped preconditioning action.\n- Enlarges the vehicle image another step across responsive Hero layouts.\n- Keeps Idle / Driving / Charging logic and telemetry contracts unchanged from beta.7.\n- Battery driving display remains absolute current_trip_energy in kWh; charging remains current_charge_power in kW; no synthetic kWh/100 km Hero value.\n- Fuel behavior remains conservative and no values are invented.\n- Functional AC / Driving / Charging runtime owner acceptance remains pending.\n\nValidation: Source/frontend PASS · Hassfest PASS · HACS PASS."