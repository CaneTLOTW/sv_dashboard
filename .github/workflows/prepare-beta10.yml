name: Prepare beta10 candidate

on:
  push:
    branches:
      - i18n-docs/issue-31-37

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare beta.10 source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          VERSION = "0.6.0-beta.10"
          ROOT = Path(".")
          STATIC = ROOT / "custom_components/sv_dashboard/static"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"required text not found in {path}: {old!r}")
              write(path, text.replace(old, new))

          # Keep identity mechanics language-neutral. The status sensor owns its
          # translation metadata just like the other package-owned sensors.
          identity = subprocess.check_output(
              ["git", "show", "origin/develop:custom_components/sv_dashboard/entity_identity.py"],
              text=True,
          )
          write("custom_components/sv_dashboard/entity_identity.py", identity)
          replace_required(
              "custom_components/sv_dashboard/sensor.py",
              '    _attr_name = "Dashboard status"\n    _attr_icon = "mdi:car-cog"',
              '    _attr_name = "Dashboard status"\n    _attr_translation_key = "dashboard_status"\n    _attr_icon = "mdi:car-cog"',
          )

          # Owner-approved German Dual-Energy wording belongs to the canonical
          # source catalog, not to another post-composition patch layer.
          replace_required(
              STATIC / "i18n-core.js",
              'fuel: "Tank", electricRange: "E-Reichweite", fuelRange: "Tankreichweite", tripEnergy: "Verbrauch"',
              'fuel: "Kraftstoff", electricRange: "E-Reichweite", fuelRange: "Kraftstoffreichweite", tripEnergy: "Verbraucht"',
          )

          # Restore the shared composition layer from develop (which already
          # contains the public card-picker naming cleanup), then cache-bust the
          # changed core catalog. Advanced catalogs are unchanged.
          i18n = subprocess.check_output(
              ["git", "show", "origin/develop:custom_components/sv_dashboard/static/i18n.js"],
              text=True,
          )
          i18n = i18n.replace(
              "All browser-facing\n * imports use the same 0.6.0-beta.7 cache key as the release candidate resources.",
              "Browser-facing imports use explicit content cache keys; the changed core catalog is cache-busted for beta.10.",
          )
          i18n = i18n.replace(
              './i18n-core.js?v=0.6.0-beta.7',
              f'./i18n-core.js?v={VERSION}',
          )
          write(STATIC / "i18n.js", i18n)

          # Every module that imports the changed shared i18n runtime gets a new
          # URL, so an upgrade cannot retain beta.7 translation modules from the
          # browser HTTP/module cache.
          i18n_consumers = [
              "trip-history-card.js",
              "charge-history-card.js",
              "vehicle-overview-card.js",
              "dual-energy-overview-card.js",
              "fuel-history-card.js",
              "sv_dashboard.js",
          ]
          for name in i18n_consumers:
              replace_required(
                  STATIC / name,
                  './i18n.js?v=0.6.0-beta.7',
                  f'./i18n.js?v={VERSION}',
              )

          # Cache-bust every changed module from the single package entry point.
          frontend = read(STATIC / "frontend.js")
          for name, old_version in [
              ("trip-history-card.js", "0.6.0-beta.7"),
              ("charge-history-card.js", "0.6.0-beta.7"),
              ("vehicle-overview-card.js", "0.6.0-beta.7"),
              ("dual-energy-overview-card.js", "0.6.0-beta.9"),
              ("fuel-history-card.js", "0.6.0-beta.7"),
              ("sv_dashboard.js", "0.6.0-beta.7"),
          ]:
              old = f'{name}?v={old_version}'
              new = f'{name}?v={VERSION}'
              if old not in frontend:
                  raise SystemExit(f"frontend cache key not found: {old}")
              frontend = frontend.replace(old, new)
          write(STATIC / "frontend.js", frontend)

          # Package/resource version.
          replace_required(
              "custom_components/sv_dashboard/manifest.json",
              '"version": "0.6.0-beta.9"',
              f'"version": "{VERSION}"',
          )
          replace_required(
              "custom_components/sv_dashboard/const.py",
              'FRONTEND_VERSION = "0.6.0-beta.9"',
              f'FRONTEND_VERSION = "{VERSION}"',
          )

          # Version assertions and the #31 single-source wording assertion.
          dashboard_test = read("tests/dashboard-naming.test.mjs").replace(
              "0.6.0-beta.9", VERSION
          )
          write("tests/dashboard-naming.test.mjs", dashboard_test)

          frontend_test_path = "tests/frontend-i18n.test.mjs"
          frontend_test = read(frontend_test_path)
          frontend_test = frontend_test.replace(
              'assert.match(runtimeSource, /i18n-core\\.js\\?v=0\\.6\\.0-beta\\.7/);',
              'assert.match(runtimeSource, /i18n-core\\.js\\?v=0\\.6\\.0-beta\\.10/);',
          )
          frontend_test = frontend_test.replace(
              '  assert.match(runtimeSource, /dualEnergyTerms/);',
              '  assert.doesNotMatch(runtimeSource, /dualEnergyTerms/);',
          )
          write(frontend_test_path, frontend_test)

          # Changelog entry for the exact external candidate.
          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "SV Dashboard uses semantic package versions. `develop` is the integration/acceptance branch; `main` represents the last explicitly accepted publishable state.\n"
          if marker not in changelog:
              raise SystemExit("CHANGELOG insertion marker not found")
          section = f'''\n## {VERSION} Hybrid/i18n external validation candidate\n\n- Localized the package-owned Dashboard status entity through the normal Home Assistant 18-language translation contract.\n- Applied the DS4 tester's reviewed French entity wording, including clarified current-trip energy and SV-local trip/charge result semantics.\n- Moved the owner-approved German Dual-Energy wording (`Kraftstoff`, `Kraftstoffreichweite`, `Verbraucht`) into the canonical frontend source catalog rather than another runtime patch layer.\n- Carries the public compact-vs-Dual-Energy card-picker naming cleanup already merged on `develop`.\n- Refreshed README, dashboard/features, localisation, capability and vehicle-card documentation and added DE/EN/FR Dual-Energy Hero examples.\n- Documents native More Info/history interactions and the Hybrid Idle/Driving/Charging data contract.\n- Explicitly distinguishes battery-side SOC/time estimates from EVSE/grid meter readings.\n- Documents how testers/users can share alternative Lovelace/YAML layouts plus screenshots as concrete feature-design input.\n- Cache-busts the changed shared i18n runtime and every consuming frontend module so beta upgrades cannot retain stale beta.7/beta.9 translation code.\n- Remains a prerelease on `develop`; promotion to `main` waits for the real DS4 Hybrid/French external test in issue #2.\n'''
          changelog_path.write_text(changelog.replace(marker, marker + section, 1), encoding="utf-8")

          # This workflow is deliberately one-shot and leaves no workflow file
          # behind in the candidate branch.
          Path(".github/workflows/prepare-beta10.yml").unlink()
          PY

      - name: Candidate source checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/sv_dashboard
          node --check custom_components/sv_dashboard/static/i18n-core.js
          node --check custom_components/sv_dashboard/static/i18n.js
          node --check custom_components/sv_dashboard/static/frontend.js
          node --check custom_components/sv_dashboard/static/dual-energy-overview-card.js
          node --test tests/*.test.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/sv_dashboard/translations').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          json.loads(Path('custom_components/sv_dashboard/manifest.json').read_text(encoding='utf-8'))
          PY

      - name: Commit candidate preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare v0.6.0-beta.10 external Hybrid candidate"
          git push origin HEAD:i18n-docs/issue-31-37
